  didDrawPage:()=>{d.setFontSize(8);d.setTextColor(110);d.text("I.T.M N’DJILI — "+c.name,10,289);d.text("Page "+d.internal.getNumberOfPages(),W-10,289,{align:"right"});d.setTextColor(0)}});
 return d}
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}
async function saveDoc(d,msg){const name=fname()+".pdf";let dl=null;
 try{dl=window.claude&&await claude.use("downloads")}catch(e){}
 if(dl){try{await dl.save({filename:name,data:d.output("blob")});toast(msg)}catch(e){if(!e||e.code!=="declined")toast("Enregistrement impossible : réessayez.")}}
 else{try{d.save(name)}catch(e){toast("Enregistrement impossible.")}}}
$("pdf").onclick=()=>{const d=build();if(!d){toast("Le module PDF n’est pas chargé. Vérifiez la connexion.");return}saveDoc(d,"PDF enregistré.")};
$("prt").onclick=()=>{const d=build();if(!d){toast("Le module PDF n’est pas chargé. Vérifiez la connexion.");return}
 d.autoPrint();let w=null;try{w=window.open(d.output("bloburl"),"_blank")}catch(e){}
 if(!w)saveDoc(d,"Fichier prêt à imprimer enregistré : ouvrez-le puis lancez l’impression.")};
$("add").onclick=()=>{const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="box"><b>Ajouter un élève — ${esc(S.cls[cur].name)}</b><input id="an" placeholder="NOM &amp; POST NOM"><select id="as"><option value="F">F</option><option value="M">M</option></select><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn alt" id="ac">Annuler</button><button class="btn" id="ao">Ajouter</button></div></div>`;
 document.body.appendChild(m);$("an").focus();$("ac").onclick=()=>m.remove();
 $("ao").onclick=()=>{const n=$("an").value.trim().toUpperCase();if(!n){$("an").focus();return}
  const c=S.cls[cur];c.st.push({n:String(c.st.length+1).padStart(2,"0"),name:n,sex:$("as").value,m:["","","","","",""]});save();m.remove();render()}};
</script>
